name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The job runs on a clean machine: the same test a user does the first
    # time, with nothing inherited from the developer.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libsdl2-dev

      - name: Copyright guard
        run: ./tools/guard_copyright.sh

      - name: bootstrap
        run: ./bootstrap.sh

      - name: Smoke test (synthetic ROM, no third-party material)
        run: ./tests/smoke.sh

      - name: Guarda de copyright (depois do build)
        # The build produces artifacts; none of them may have leaked into git.
        run: ./tools/guard_copyright.sh

      - name: Check that the build did not dirty the repository
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build created tracked files:"
            git status --porcelain
            exit 1
          fi

      - name: Release artifact builds and checks itself
        run: ./packaging/make_release.sh 0.0.0-ci