name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # O job roda numa máquina limpa: é o mesmo teste que um usuário faz pela
    # primeira vez, sem nada herdado do desenvolvedor.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libsdl2-dev

      - name: Guarda de copyright
        run: ./tools/guard_copyright.sh

      - name: bootstrap
        run: ./bootstrap.sh

      - name: Prova de fumaça (ROM sintética, sem material de terceiros)
        run: ./tests/smoke.sh

      - name: Guarda de copyright (depois do build)
        # O build gera artefatos; nenhum deles pode ter vazado para o git.
        run: ./tools/guard_copyright.sh

      - name: Confirma que o build não sujou o repositório
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::o build criou arquivos versionados:"
            git status --porcelain
            exit 1
          fi

      - name: Artefato de release monta e se autoverifica
        run: ./packaging/make_release.sh 0.0.0-ci