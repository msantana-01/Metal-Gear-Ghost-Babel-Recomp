name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.6; defaults to tag without leading v or pins.lock)"
        required: false
        type: string

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(sed -n '/^\[tools\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*//p' pins.lock | head -1)"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libsdl2-dev

      - name: Copyright guard
        run: ./tools/guard_copyright.sh

      - name: Bootstrap tools from pinned source
        env:
          GB_BUILD_FROM_SOURCE: "1"
        run: ./bootstrap.sh

      - name: Smoke test
        run: ./tests/smoke.sh

      - name: Copyright guard (post-build)
        run: ./tools/guard_copyright.sh

      - name: Package Linux release archive
        run: ./packaging/make_release.sh "${{ steps.ver.outputs.version }}"

      - name: Test unpacked release archive offline
        run: |
          VER="${{ steps.ver.outputs.version }}"
          rm -rf /tmp/linux-rel-smoke
          mkdir -p /tmp/linux-rel-smoke
          tar -xzf "packaging/dist/ghost-babel-tools-linux-x86_64-${VER}.tar.gz" -C /tmp/linux-rel-smoke
          cd /tmp/linux-rel-smoke/ghost-babel-tools
          ./bootstrap.sh
          ./tests/smoke.sh

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            packaging/dist/ghost-babel-tools-linux-x86_64-*.tar.gz
            packaging/dist/ghost-babel-tools-linux-x86_64-*.tar.gz.sha256

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $inVer = "${{ inputs.version }}"
          if ($inVer) {
              $ver = $inVer
          } elseif ($env:GITHUB_REF_NAME -match '^v(.+)$') {
              $ver = $matches[1]
          } else {
              $ver = (Get-Content pins.lock | Select-String '^version\s*=\s*(.+)$' | Select-Object -First 1).Matches[0].Groups[1].Value.Trim()
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path windows,packaging -Filter *.ps1 -Recurse
          foreach ($f in $files) {
              $tokens = $null; $errs = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
              if ($errs -and $errs.Count -gt 0) {
                  $errs | ForEach-Object { Write-Error "$($f.FullName): $($_.Message)" }
                  exit 1
              }
          }

      - name: Copyright guard
        shell: bash
        run: ./tools/guard_copyright.sh

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Bootstrap Windows toolchain from pinned source
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File windows/bootstrap.ps1 -FromSource

      - name: Package Windows release archive
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/make_release_windows.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Test unpacked Windows release archive end-to-end
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "win-rel-smoke"
          if (Test-Path $smokeRoot) { Remove-Item -Recurse -Force $smokeRoot }
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null

          Expand-Archive -Path "packaging/dist/ghost-babel-tools-windows-x86_64-${ver}.zip" -DestinationPath $smokeRoot -Force
          $pkgDir = Join-Path $smokeRoot "ghost-babel-tools"
          $romPath = Join-Path $smokeRoot "testrom.gbc"
          python tests/make_test_rom.py $romPath
          if ($LASTEXITCODE -ne 0) { exit 1 }

          pwsh -NoProfile -ExecutionPolicy Bypass -File (Join-Path $pkgDir "windows/build.ps1") `
              -RomPath $romPath -NoPrompt -ForceRemaster -SyntheticSmoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $authExe   = Join-Path $pkgDir "build/ghost-babel-authentic.exe"
          $remastExe = Join-Path $pkgDir "build/ghost-babel-remaster.exe"
          $sdlDll    = Join-Path $pkgDir "build/SDL2.dll"
          foreach ($req in @($authExe, $remastExe, $sdlDll)) {
              if (-not (Test-Path $req)) { throw "Missing build output: $req" }
          }

          $objdump = Join-Path $pkgDir ".tools/w64devkit/bin/objdump.exe"
          foreach ($exe in @($authExe, $remastExe)) {
              $imports = & $objdump -p $exe | Select-String "DLL Name:"
              $bad = $imports | Where-Object { $_ -match 'libgcc|libstdc\+\+|winpthread' }
              if ($bad) { throw "Forbidden compiler runtime DLL import in $exe`: $bad" }
              if (-not ($imports | Where-Object { $_ -match 'SDL2\.dll' })) {
                  throw "Missing SDL2.dll import in $exe"
              }
          }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            packaging/dist/ghost-babel-tools-windows-x86_64-*.zip
            packaging/dist/ghost-babel-tools-windows-x86_64-*.zip.sha256

  publish:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Verify checksums
        run: |
          cd dist/release-linux && sha256sum -c *.sha256
          cd ../release-windows && sha256sum -c *.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILES=(
            dist/release-linux/*.tar.gz
            dist/release-linux/*.tar.gz.sha256
            dist/release-windows/*.zip
            dist/release-windows/*.zip.sha256
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "$TAG" --generate-notes
          fi
