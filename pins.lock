# Pins de dependência — Metal Gear Ghost Babel Recomp
#
# Read by bootstrap.sh (format: key = value, per section).
# Do not edit by hand: changing a pin here changes the build output.
#
# The engine is never fetched from a private mirror. The tool comes from
# public upstream plus a versioned patch from this repository.

[engine]
name         = gb-recompiled
url          = https://github.com/arcanite24/gb-recompiled.git
commit       = 9150f87d82fa98abcb6ea22329170463f9702eb8
patch        = patches/gb-recompiled-ghost-babel.patch
patch_sha256 = a4346c45a18431950c031418bbaec0d09d0b3c252587dbb2ca5275bade10405c
# Expected source tree AFTER applying the patch. The bootstrap fails if it
# does not match: that is what guarantees the patch still applies cleanly.
tree_after   = 149dbc13494e487a3f23cb8178188d05bb7a2c4e

[build]
# Lowest SDL2 tested. The runtime has a single SDL_VERSION_ATLEAST(2,0,12).
sdl2_min     = 2.0.12
# Mandatory define when compiling the generated C. Without it the binary
# links, but is born without video, input or dumping - a dead game, silently.
runtime_define = GB_HAS_SDL2

[tools]
# Tool version. One line across platforms: the same ROM and the same tool
# version produce the same output everywhere.
version = 0.3
# Where the prebuilt tools live. With this filled in, bootstrap downloads
# gbrecomp and the runtime instead of compiling them, and the user never
# needs cmake or ninja. Empty means "compile from source" - which is what
# a clone straight from git does.
release_base = https://github.com/msantana-01/Metal-Gear-Ghost-Babel-Recomp/releases/download/v0.3